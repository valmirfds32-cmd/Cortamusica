<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortador de Áudio Pro - Com Gravador</title>
    <style>
        /* Estilos Gerais e Layout */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1c;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Cabeçalho */
        header {
            background-color: #111;
            padding: 10px 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        /* Rodapé */
        footer {
            background-color: #111;
            padding: 15px;
            text-align: center;
            margin-top: auto;
            border-top: 1px solid #333;
            font-size: 12px;
            color: #888;
        }

        /* Espaço de Publicidade */
        .ad-space {
            background-color: #2a2a2d;
            color: #888;
            border: 1px dashed #555;
            border-radius: 4px;
            max-width: 728px;
            height: 90px;
            margin: 5px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        /* Conteúdo Principal */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #222;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        /* Área do Visualizador de Áudio (Sobreposição) */
        .waveform-relative {
            position: relative; /* Necessário para sobrepor os canvas */
            width: 100%;
            height: 150px;
            margin-top: 15px;
            background-color: #111;
            border-radius: 6px;
            overflow: hidden; /* Garante que nada saia da borda */
            cursor: pointer;
        }

        /* Canvas da Onda (Fundo Estático) */
        #waveform-static {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Fica atrás */
        }

        /* Canvas da Linha de Reprodução (Frente Dinâmico) */
        #waveform-dynamic {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; /* Fica na frente */
            pointer-events: none;
        }

        /* Componentes do Cortador */
        .input-zone {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        input[type="file"] {
            color: #e0e0e0;
        }
        
        .controls {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            font-size: 13px;
            margin-bottom: 3px;
            color: #aaa;
        }
        input[type="number"] {
            background-color: #333;
            border: 1px solid #444;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            width: 70px;
            text-align: center;
        }
        button {
            background-color: #444;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 18px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover:not(:disabled) {
            background-color: #555;
        }
        button:disabled {
            color: #666;
            cursor: not-allowed;
        }
        #btn-record {
            background-color: #c62828; /* Vermelho para Gravar */
            border-color: #b71c1c;
        }
        #btn-record:hover:not(:disabled) {
            background-color: #d32f2f;
        }
        #btn-record.recording {
            background-color: #ff8f00; /* Laranja piscando para Gravando */
            animation: pulse 1.5s infinite;
        }
        #btn-play {
            background-color: #2e7d32; /* Verde para Play */
        }
        #btn-play:hover:not(:disabled) {
            background-color: #388e3c;
        }
        #btn-cut {
            background-color: #1565c0; /* Azul para Cortar */
        }
        #btn-cut:hover:not(:disabled) {
            background-color: #1976d2;
        }

        #status {
            margin-top: 10px;
            font-style: italic;
            color: #ffca28; /* Amarelo para alertas */
            font-size: 14px;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="ad-space">
            <span>Publicidade Superior (728x90)</span>
        </div>
    </header>

    <main>
        <div class="container">
            <h2 style="margin-top: 0;">Cortador de Áudio MP3 Pro</h2>
            <p style="color: #aaa; font-size: 14px;">Carregue um arquivo ou grave direto do microfone, visualize a onda e corte com precisão.</p>
            
            <div class="input-zone">
                <input type="file" id="audio-file" accept="audio/mp3, audio/*">
                <span style="color: #666;">ou</span>
                <button id="btn-record">Gravar Áudio</button>
            </div>
            
            <div class="waveform-relative" id="waveform-container">
                <canvas id="waveform-static"></canvas>
                <canvas id="waveform-dynamic"></canvas>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label for="start-time">Início (s)</label>
                    <input type="number" id="start-time" value="0" min="0" step="0.01" disabled>
                </div>
                <div class="control-group">
                    <label for="end-time">Fim (s)</label>
                    <input type="number" id="end-time" value="0" min="0" step="0.01" disabled>
                </div>
            </div>

            <div class="controls">
                <button id="btn-play" disabled>Tocar Seleção</button>
                <button id="btn-cut" disabled>Cortar e Salvar</button>
            </div>

            <div id="status"></div>
        </div>
    </main>

    <footer>
        <div class="ad-space">
            <span>Publicidade Inferior (728x90)</span>
        </div>
        <p style="margin-top: 10px;">&copy; 2026 Cortador Pro Web. Processamento 100% local no navegador.</p>
    </footer>

<script>
    let audioContext;
    let audioBuffer;
    let sourceNode;
    let isPlaying = false;
    let startTimePlay = 0; 
    let offsetPlay = 0;    
    let animationRequest; 

    // Variáveis do Gravador
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    const fileInput = document.getElementById('audio-file');
    const container = document.getElementById('waveform-container');
    const btnRecord = document.getElementById('btn-record');
    
    const canvasStatic = document.getElementById('waveform-static');
    const ctxStatic = canvasStatic.getContext('2d', { alpha: false });

    const canvasDynamic = document.getElementById('waveform-dynamic');
    const ctxDynamic = canvasDynamic.getContext('2d');

    const startTimeInput = document.getElementById('start-time');
    const endTimeInput = document.getElementById('end-time');
    const btnPlay = document.getElementById('btn-play');
    const btnCut = document.getElementById('btn-cut');
    const statusDiv = document.getElementById('status');

    function getAudioContext() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioContext;
    }

    // Gerencia os dados após carregamento/gravação com sucesso
    async function processNewAudioBuffer(buffer, labelText) {
        audioBuffer = buffer;
        statusDiv.innerText = `${labelText}: ${audioBuffer.duration.toFixed(2)} segundos.`;
        
        startTimeInput.value = 0;
        startTimeInput.max = audioBuffer.duration;
        endTimeInput.value = audioBuffer.duration.toFixed(2);
        endTimeInput.max = audioBuffer.duration;
        
        startTimeInput.disabled = endTimeInput.disabled = btnPlay.disabled = btnCut.disabled = false;
        
        resizeCanvas();
        drawWaveform(audioBuffer);
        clearDynamicCanvas();
    }

    // Evento de Arquivo Carregado
    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        statusDiv.innerText = "Decodificando áudio... Aguarde.";
        btnPlay.disabled = btnCut.disabled = true;

        if (isPlaying) stopPlayback();

        const ctxAudio = getAudioContext();
        const arrayBuffer = await file.arrayBuffer();
        
        try {
            const decodedBuffer = await ctxAudio.decodeAudioData(arrayBuffer);
            await processNewAudioBuffer(decodedBuffer, "Áudio carregado");
        } catch (error) {
            statusDiv.innerText = "Erro ao carregar o áudio. Verifique se é um arquivo válido.";
            console.error(error);
        }
    });

    // Lógica do Botão Gravar / Parar Gravação
    btnRecord.addEventListener('click', async () => {
        if (!isRecording) {
            // Iniciar Gravação
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    statusDiv.innerText = "Processando áudio gravado... Aguarde.";
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const arrayBuffer = await audioBlob.arrayBuffer();
                    const ctxAudio = getAudioContext();

                    try {
                        const decodedBuffer = await ctxAudio.decodeAudioData(arrayBuffer);
                        await processNewAudioBuffer(decodedBuffer, "Áudio gravado com sucesso");
                    } catch (err) {
                        statusDiv.innerText = "Erro ao decodificar o áudio gravado.";
                        console.error(err);
                    }

                    // Fecha as tracks do microfone para desligar a luz de gravação do navegador
                    stream.getTracks().forEach(track => track.stop());
                };

                if (isPlaying) stopPlayback();
                
                mediaRecorder.start();
                isRecording = true;
                btnRecord.innerText = "Parar Gravação";
                btnRecord.classList.add('recording');
                statusDiv.innerText = "Gravando... Fale no seu microfone.";
                btnPlay.disabled = btnCut.disabled = true;

            } catch (err) {
                statusDiv.innerText = "Permissão de microfone negada ou não suportada.";
                console.error(err);
            }
        } else {
            // Parar Gravação
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecording = false;
            btnRecord.innerText = "Gravar Áudio";
            btnRecord.classList.remove('recording');
        }
    });

    function resizeCanvas() {
        canvasStatic.width = container.clientWidth;
        canvasStatic.height = container.clientHeight;
        canvasDynamic.width = container.clientWidth;
        canvasDynamic.height = container.clientHeight;
    }

    window.addEventListener('resize', () => {
        if (audioBuffer) {
            resizeCanvas();
            drawWaveform(audioBuffer);
            if (!isPlaying) clearDynamicCanvas();
        }
    });

    function drawWaveform(buffer) {
        const width = canvasStatic.width;
        const height = canvasStatic.height;
        const data = buffer.getChannelData(0);
        const step = Math.ceil(data.length / width);
        const amp = height / 2;

        ctxStatic.fillStyle = '#111';
        ctxStatic.fillRect(0, 0, width, height);
        
        ctxStatic.strokeStyle = '#555';
        ctxStatic.lineWidth = 1;
        ctxStatic.beginPath();

        for (let i = 0; i < width; i++) {
            let min = 1.0;
            let max = -1.0;
            for (let j = 0; j < step; j++) {
                const datum = data[(i * step) + j];
                if (datum < min) min = datum;
                if (datum > max) max = datum;
            }
            ctxStatic.moveTo(i, (1 + min) * amp);
            ctxStatic.lineTo(i, (1 + max) * amp);
        }
        ctxStatic.stroke();
    }

    function clearDynamicCanvas() {
        ctxDynamic.clearRect(0, 0, canvasDynamic.width, canvasDynamic.height);
    }

    function drawPlaybackLine() {
        if (!isPlaying || !audioBuffer) return;

        const ctxAudio = getAudioContext();
        const currentTime = (ctxAudio.currentTime - startTimePlay) + offsetPlay;
        const duration = audioBuffer.duration;

        if (currentTime >= duration || currentTime >= parseFloat(endTimeInput.value)) {
            stopPlayback();
            return;
        }

        const x = (currentTime / duration) * canvasDynamic.width;

        clearDynamicCanvas();
        ctxDynamic.strokeStyle = '#ff1744';
        ctxDynamic.lineWidth = 2;
        ctxDynamic.beginPath();
        ctxDynamic.moveTo(x, 0);
        ctxDynamic.lineTo(x, canvasDynamic.height);
        ctxDynamic.stroke();

        animationRequest = requestAnimationFrame(drawPlaybackLine);
    }

    container.addEventListener('click', (e) => {
        if (!audioBuffer) return;
        
        if (isPlaying) stopPlayback();

        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const clickedTime = (x / rect.width) * audioBuffer.duration;
        
        const start = parseFloat(startTimeInput.value);
        const end = parseFloat(endTimeInput.value);

        if (Math.abs(clickedTime - start) < Math.abs(clickedTime - end)) {
            startTimeInput.value = clickedTime.toFixed(2);
        } else {
            endTimeInput.value = clickedTime.toFixed(2);
        }
    });

    function stopPlayback() {
        if (!isPlaying) return;
        
        if (sourceNode) {
            sourceNode.stop();
            sourceNode.disconnect();
        }
        isPlaying = false;
        btnPlay.innerText = "Tocar Seleção";
        cancelAnimationFrame(animationRequest);
        clearDynamicCanvas();
    }

    btnPlay.addEventListener('click', () => {
        if (isPlaying) {
            stopPlayback();
            return;
        }

        const ctxAudio = getAudioContext();
        const start = parseFloat(startTimeInput.value);
        const end = parseFloat(endTimeInput.value);
        const durationToPlay = end - start;

        if (durationToPlay <= 0) {
            statusDiv.innerText = "Ajuste o tempo de Fim para ser maior que o Início.";
            return;
        }

        sourceNode = ctxAudio.createBufferSource();
        sourceNode.buffer = audioBuffer;
        sourceNode.connect(ctxAudio.destination);
        
        offsetPlay = start;
        startTimePlay = ctxAudio.currentTime;
        
        sourceNode.start(0, start, durationToPlay);
        
        isPlaying = true;
        btnPlay.innerText = "Parar";
        statusDiv.innerText = `Tocando seleção: ${start.toFixed(2)}s até ${end.toFixed(2)}s.`;

        sourceNode.onended = () => {
            if (isPlaying) stopPlayback();
        };

        drawPlaybackLine();
    });

    btnCut.addEventListener('click', () => {
        const start = parseFloat(startTimeInput.value);
        const end = parseFloat(endTimeInput.value);
        
        if (start >= end) {
            statusDiv.innerText = "Erro: Seleção de corte inválida.";
            return;
        }

        const sampleRate = audioBuffer.sampleRate;
        const startSample = Math.floor(start * sampleRate);
        const endSample = Math.floor(end * sampleRate);
        const durationInSamples = endSample - startSample;

        const ctxAudio = getAudioContext();
        const cutBuffer = ctxAudio.createBuffer(audioBuffer.numberOfChannels, durationInSamples, sampleRate);

        for (let channel = 0; channel < audioBuffer.numberOfChannels; channel++) {
            cutBuffer.getChannelData(channel).set(
                audioBuffer.getChannelData(channel).subarray(startSample, endSample)
            );
        }

        const wavBlob = bufferToWav(cutBuffer);
        const url = URL.createObjectURL(wavBlob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = `corte_${start.toFixed(1)}s_${end.toFixed(1)}s.wav`;
        a.click();
        
        statusDiv.innerText = "Corte realizado e download iniciado (formato WAV).";
    });

    function bufferToWav(buffer) {
        const numOfChan = buffer.numberOfChannels,
            length = buffer.length * numOfChan * 2 + 44,
            bufferArr = new ArrayBuffer(length),
            view = new DataView(bufferArr),
            channels = [], sampleRate = buffer.sampleRate;
        let pos = 0, offset = 0;
        function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
        function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
        setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
        setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
        setUint32(sampleRate); setUint32(sampleRate * 2 * numOfChan);
        setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164);
        setUint32(length - pos - 4);
        for (let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));
        while (pos < length) {
            for (let i = 0; i < numOfChan; i++) {
                let sample = Math.max(-1, Math.min(1, channels[i][offset]));
                sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                view.setInt16(pos, sample, true); pos += 2;
            }
            offset++;
        }
        return new Blob([bufferArr], { type: 'audio/wav' });
    }
</script>

</body>
</html>

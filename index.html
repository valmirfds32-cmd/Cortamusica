<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortador de Áudio Pro - Com Ajuste de Escala</title>
    <style>
        /* Estilos Gerais e Layout */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1c;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Cabeçalho */
        header {
            background-color: #111;
            padding: 10px 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        /* Rodapé */
        footer {
            background-color: #111;
            padding: 15px;
            text-align: center;
            margin-top: auto;
            border-top: 1px solid #333;
            font-size: 12px;
            color: #888;
        }

        /* Espaço de Publicidade */
        .ad-space {
            background-color: #2a2a2d;
            color: #888;
            border: 1px dashed #555;
            border-radius: 4px;
            max-width: 728px;
            height: 90px;
            margin: 5px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        /* Conteúdo Principal */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #222;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        /* Linha superior ao gráfico contendo as Labels/Cronômetro */
        .waveform-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding: 0 2px;
        }

        .label-style {
            font-size: 13px;
            color: #aaa;
            font-weight: normal;
        }

        /* Área de Rolagem para permitir o Zoom (Escala) */
        .waveform-scroll-container {
            width: 100%;
            height: 150px;
            background-color: #111;
            border-radius: 6px;
            overflow-x: auto; /* Permite barra de rolagem horizontal se o zoom for grande */
            overflow-y: hidden;
            margin-top: 5px;
            border: 1px solid #333;
        }

        /* Área interna do Visualizador de Áudio (Sobreposição) */
        .waveform-relative {
            position: relative;
            width: 100%; /* Será controlado dinamicamente via JS (ex: 100%, 200%, 300%) */
            height: 100%;
            cursor: pointer;
        }

        /* Canvas da Onda (Fundo Estático) */
        #waveform-static {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Canvas da Linha de Reprodução (Frente Dinâmico) */
        #waveform-dynamic {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Componentes do Cortador */
        input[type="file"] {
            margin: 15px 0;
            color: #e0e0e0;
        }
        
        .controls {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        input[type="number"] {
            background-color: #333;
            border: 1px solid #444;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            width: 85px;
            text-align: center;
        }
        button {
            background-color: #444;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 18px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover:not(:disabled) {
            background-color: #555;
        }
        button:disabled {
            color: #666;
            background-color: #2d2d2d;
            border-color: #333;
            cursor: not-allowed;
        }
        
        /* Botões de Zoom específicos */
        .btn-zoom {
            background-color: #3f51b5;
            font-weight: bold;
        }
        .btn-zoom:hover:not(:disabled) {
            background-color: #5c6bc0;
        }

        #btn-play {
            background-color: #2e7d32;
        }
        #btn-play:hover:not(:disabled) {
            background-color: #388e3c;
        }
        #btn-cut {
            background-color: #1565c0;
        }
        #btn-cut:hover:not(:disabled) {
            background-color: #1976d2;
        }

        #status {
            margin-top: 10px;
            font-style: italic;
            color: #ffca28;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="ad-space">
            <span>Publicidade Superior (728x90)</span>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        <div class="container">
            <h2 style="margin-top: 0; margin-bottom: 5px;">Cortador de Áudio MP3 Pro</h2>
            <p style="color: #aaa; font-size: 14px; margin-bottom: 15px; margin-top: 0;">Ajuste a escala visual para obter o corte milimétrico ideal.</p>
            
            <input type="file" id="audio-file" accept="audio/mp3, audio/*">
            
            <!-- Linha com rótulos e o novo cronômetro discreto -->
            <div class="waveform-header">
                <span class="label-style">Visualização do Áudio</span>
                <span class="label-style" id="timer" style="color: #ff1744; font-weight: bold;">00:00.0 / 00:00.0</span>
            </div>
            
            <!-- ÁREA DO VISUALIZADOR COM ROLAGEM -->
            <div class="waveform-scroll-container">
                <div class="waveform-relative" id="waveform-container">
                    <canvas id="waveform-static"></canvas>
                    <canvas id="waveform-dynamic"></canvas>
                </div>
            </div>
            
            <!-- CONTROLES DE ESCALA / ZOOM -->
            <div class="controls" style="margin-top: 10px;">
                <button id="btn-zoom-out" class="btn-zoom" disabled> Escala [ - ] </button>
                <button id="btn-zoom-in" class="btn-zoom" disabled> Escala [ + ] </button>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <span class="label-style" style="margin-bottom: 3px;">Início (s)</span>
                    <input type="number" id="start-time" value="0" min="0" step="0.01" disabled>
                </div>
                <div class="control-group">
                    <span class="label-style" style="margin-bottom: 3px;">Fim (s)</span>
                    <input type="number" id="end-time" value="0" min="0" step="0.01" disabled>
                </div>
            </div>

            <div class="controls">
                <button id="btn-play" disabled>Tocar Seleção</button>
                <button id="btn-cut" disabled>Cortar e Salvar</button>
            </div>

            <div id="status"></div>
        </div>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <div class="ad-space">
            <span>Publicidade Inferior (728x90)</span>
        </div>
        <p style="margin-top: 10px;">&copy; 2026 Cortador Pro Web. Processamento 100% local no navegador.</p>
    </footer>

<script>
    let audioContext;
    let audioBuffer;
    let sourceNode;
    let isPlaying = false;
    let startTimePlay = 0; 
    let offsetPlay = 0;    
    let animationRequest; 
    
    // Controle de Escala (Zoom)
    let currentZoom = 100; // Porcentagem de largura (100% = padrão da caixa original)
    const ZOOM_STEP = 50;  // Aumenta ou diminui de 50% em 50%
    const MAX_ZOOM = 500;  // Limite máximo de esticamento (5x)
    const MIN_ZOOM = 100;  // Limite mínimo (tamanho padrão)

    const fileInput = document.getElementById('audio-file');
    const container = document.getElementById('waveform-container');
    const timerDisplay = document.getElementById('timer');
    
    const canvasStatic = document.getElementById('waveform-static');
    const ctxStatic = canvasStatic.getContext('2d', { alpha: false });

    const canvasDynamic = document.getElementById('waveform-dynamic');
    const ctxDynamic = canvasDynamic.getContext('2d');

    const startTimeInput = document.getElementById('start-time');
    const endTimeInput = document.getElementById('end-time');
    const btnPlay = document.getElementById('btn-play');
    const btnCut = document.getElementById('btn-cut');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const statusDiv = document.getElementById('status');

    function getAudioContext() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioContext;
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        const tenths = Math.floor((seconds % 1) * 10);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${tenths}`;
    }

    function updateStaticTimer() {
        const current = parseFloat(startTimeInput.value) || 0;
        const total = parseFloat(endTimeInput.value) || 0;
        timerDisplay.innerText = `${formatTime(current)} / ${formatTime(total)}`;
    }

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        statusDiv.innerText = "Decodificando áudio... Aguarde.";
        btnPlay.disabled = btnCut.disabled = true;
        btnZoomIn.disabled = btnZoomOut.disabled = true;

        if (isPlaying) stopPlayback(); 

        const ctxAudio = getAudioContext();
        const arrayBuffer = await file.arrayBuffer();
        
        try {
            audioBuffer = await ctxAudio.decodeAudioData(arrayBuffer);
            statusDiv.innerText = `Áudio carregado com sucesso.`;
            
            startTimeInput.value = 0;
            startTimeInput.max = audioBuffer.duration;
            endTimeInput.value = audioBuffer.duration.toFixed(2);
            endTimeInput.max = audioBuffer.duration;
            
            startTimeInput.disabled = endTimeInput.disabled = btnPlay.disabled = btnCut.disabled = false;
            btnZoomIn.disabled = btnZoomOut.disabled = false;
            
            // Força resetar o zoom para o padrão ao carregar nova música
            currentZoom = 100;
            applyZoom();

        } catch (error) {
            statusDiv.innerText = "Erro ao carregar o áudio. Verifique se é um MP3 válido.";
            console.error(error);
        }
    });

    // Redimensiona os Canvas baseando-se na largura alterada pelo zoom
    function resizeCanvas() {
        const parentElement = container.parentElement;
        // Calcula a largura esticada baseada na porcentagem do zoom
        const targetWidth = (parentElement.clientWidth * currentZoom) / 100;
        
        container.style.width = targetWidth + 'px';
        canvasStatic.width = targetWidth;
        canvasStatic.height = container.clientHeight;
        canvasDynamic.width = targetWidth;
        canvasDynamic.height = container.clientHeight;
    }

    // Aplica as alterações de zoom, redesenhando os elementos
    function applyZoom() {
        if (!audioBuffer) return;
        resizeCanvas();
        drawWaveform(audioBuffer);
        clearDynamicCanvas();
        updateStaticTimer();
        
        // Ativa/desativa botões de limite
        btnZoomIn.disabled = (currentZoom >= MAX_ZOOM);
        btnZoomOut.disabled = (currentZoom <= MIN_ZOOM);
    }

    // Botões de Escala (Zoom) clicados
    btnZoomIn.addEventListener('click', () => {
        if (currentZoom < MAX_ZOOM) {
            currentZoom += ZOOM_STEP;
            applyZoom();
        }
    });

    btnZoomOut.addEventListener('click', () => {
        if (currentZoom > MIN_ZOOM) {
            currentZoom -= ZOOM_STEP;
            applyZoom();
        }
    });

    window.addEventListener('resize', () => {
        if (audioBuffer) {
            applyZoom();
        }
    });

    function drawWaveform(buffer) {
        const width = canvasStatic.width;
        const height = canvasStatic.height;
        const data = buffer.getChannelData(0);
        const step = Math.ceil(data.length / width);
        const amp = height / 2;

        ctxStatic.fillStyle = '#111'; 
        ctxStatic.fillRect(0, 0, width, height);
        
        ctxStatic.strokeStyle = '#555'; 
        ctxStatic.lineWidth = 1;
        ctxStatic.beginPath();

        for (let i = 0; i < width; i++) {
            let min = 1.0;
            let max = -1.0;
            for (let j = 0; j < step; j++) {
                const datum = data[(i * step) + j];
                if (datum < min) min = datum;
                if (datum > max) max = datum;
            }
            ctxStatic.moveTo(i, (1 + min) * amp);
            ctxStatic.lineTo(i, (1 + max) * amp);
        }
        ctxStatic.stroke();
    }

    function clearDynamicCanvas() {
        ctxDynamic.clearRect(0, 0, canvasDynamic.width, canvasDynamic.height);
    }

    function drawPlaybackLine() {
        if (!isPlaying || !audioBuffer) return;

        const ctxAudio = getAudioContext();
        const currentTime = (ctxAudio.currentTime - startTimePlay) + offsetPlay;
        const duration = audioBuffer.duration;
        const endTime = parseFloat(endTimeInput.value);

        if (currentTime >= duration || currentTime >= endTime) {
            stopPlayback();
            return;
        }

        timerDisplay.innerText = `${formatTime(currentTime)} / ${formatTime(endTime)}`;

        const x = (currentTime / duration) * canvasDynamic.width;
        clearDynamicCanvas();
        ctxDynamic.strokeStyle = '#ff1744'; 
        ctxDynamic.lineWidth = 2;
        ctxDynamic.beginPath();
        ctxDynamic.moveTo(x, 0);
        ctxDynamic.lineTo(x, canvasDynamic.height);
        ctxDynamic.stroke();

        animationRequest = requestAnimationFrame(drawPlaybackLine);
    }

    startTimeInput.addEventListener('input', updateStaticTimer);
    endTimeInput.addEventListener('input', updateStaticTimer);

    container.addEventListener('click', (e) => {
        if (!audioBuffer) return;
        
        if (isPlaying) stopPlayback();

        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const clickedTime = (x / rect.width) * audioBuffer.duration;
        
        const start = parseFloat(startTimeInput.value);
        const end = parseFloat(endTimeInput.value);

        if (Math.abs(clickedTime - start) < Math.abs(clickedTime - end)) {
            startTimeInput.value = clickedTime.toFixed(2);
        } else {
            endTimeInput.value = clickedTime.toFixed(2);
        }
        updateStaticTimer();
    });

    function stopPlayback() {
        if (!isPlaying) return;
        
        if (sourceNode) {
            sourceNode.stop();
            sourceNode.disconnect();
        }
        isPlaying = false;
        btnPlay.innerText = "Tocar Seleção";
        cancelAnimationFrame(animationRequest);
        clearDynamicCanvas(); 
        updateStaticTimer(); 
    }

    btnPlay.addEventListener('click', () => {
        if (isPlaying) {
            stopPlayback();
            return;
        }

        const ctxAudio = getAudioContext();
        const start = parseFloat(startTimeInput.value);
        const end = parseFloat(endTimeInput.value);
        const durationToPlay = end - start;

        if (durationToPlay <= 0) {
            statusDiv.innerText = "Ajuste o tempo de Fim para ser maior que o Início.";
            return;
        }

        sourceNode = ctxAudio.createBufferSource();
        sourceNode.buffer = audioBuffer;
        sourceNode.connect(ctxAudio.destination);
        
        offsetPlay = start; 
        startTimePlay = ctxAudio.currentTime; 
        
        sourceNode.start(0, start, durationToPlay);
        
        isPlaying = true;
        btnPlay.innerText = "Parar";
        statusDiv.innerText = `Tocando trecho selecionado.`;

        sourceNode.onended = () => {
            if (isPlaying) stopPlayback();
        };

        drawPlaybackLine();
    });

    btnCut.addEventListener('click', () => {
        const start = parseFloat(startTimeInput.value);
        const end = parseFloat(endTimeInput.value);
        
        if (start >= end) {
            statusDiv.innerText = "Erro: Seleção de corte inválida.";
            return;
        }

        const sampleRate = audioBuffer.sampleRate;
        const startSample = Math.floor(start * sampleRate);
        const endSample = Math.floor(end * sampleRate);
        const durationInSamples = endSample - startSample;

        const ctxAudio = getAudioContext();
        const cutBuffer = ctxAudio.createBuffer(audioBuffer.numberOfChannels, durationInSamples, sampleRate);

        for (let channel = 0; channel < audioBuffer.numberOfChannels; channel++) {
            cutBuffer.getChannelData(channel).set(
                audioBuffer.getChannelData(channel).subarray(startSample, endSample)
            );
        }

        const wavBlob = bufferToWav(cutBuffer);
        const url = URL.createObjectURL(wavBlob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = `corte_${start.toFixed(1)}s_${end.toFixed(1)}s.wav`;
        a.click();
        
        statusDiv.innerText = "Corte realizado e download iniciado (formato WAV).";
    });

    function bufferToWav(buffer) {
        const numOfChan = buffer.numberOfChannels,
            length = buffer.length * numOfChan * 2 + 44,
            bufferArr = new ArrayBuffer(length),
            view = new DataView(bufferArr),
            channels = [], sampleRate = buffer.sampleRate;
        let pos = 0, offset = 0;
        function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
        function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
        setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
        setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
        setUint32(sampleRate); setUint32(sampleRate * 2 * numOfChan);
        setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164);
        setUint32(length - pos - 4);
        for (let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));
        while (pos < length) {
            for (let i = 0; i < numOfChan; i++) {
                let sample = Math.max(-1, Math.min(1, channels[i][offset]));
                sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                view.setInt16(pos, sample, true); pos += 2;
            }
            offset++;
        }
        return new Blob([bufferArr], { type: 'audio/wav' });
    }
</script>

</body>
</html>
